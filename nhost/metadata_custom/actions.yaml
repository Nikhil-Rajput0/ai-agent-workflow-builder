actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/triggerWorkflowRun"
      forward_client_headers: true
      headers:
        - name: x-hasura-admin-secret
          value_from_env: HASURA_GRAPHQL_ADMIN_SECRET
      timeout: 60
    permissions:
      - role: user

  - name: approveStep
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/approveStep"
      forward_client_headers: true
      headers:
        - name: x-hasura-admin-secret
          value_from_env: HASURA_GRAPHQL_ADMIN_SECRET
      timeout: 30
    permissions:
      - role: user

custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
    - name: ApproveStepOutput
  scalars: []
